# Generated by python -m tools.generate_workflow --pipeline geektime-he
# Source config: pipelines/geektime-he.yaml
name: geektime-he

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,9,11,13,15,17,19,21,23 * * *'
      timezone: "Asia/Jerusalem"

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: geektime-he-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: geektime-he
    timeout-minutes: 60
    container:
      image: 'ghcr.io/copypastefail/articles-rss-to-podcast-runtime@sha256:e41dc03c1ef1b591be8109a988d562edcd686e9f104c5ad829b411b204d58311'
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Mask Google auth metadata
        shell: bash
        run: |
          echo "::add-mask::${{ vars.GCP_PROJECT_ID }}"
          echo "::add-mask::${{ vars.GCP_PROJECT_NUMBER }}"
          echo "::add-mask::${{ vars.GCP_WIF_POOL_ID }}"
          echo "::add-mask::${{ vars.GCP_WIF_PROVIDER_ID }}"
          echo "::add-mask::projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL_ID }}/providers/${{ vars.GCP_WIF_PROVIDER_ID }}"
          echo "::add-mask::${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}"
          echo "::add-mask::${{ github.workspace }}"
          echo "::add-mask::gha-creds-"

      - uses: google-github-actions/auth@v3
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL_ID }}/providers/${{ vars.GCP_WIF_PROVIDER_ID }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Run selected pipeline
        id: run_pipeline
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          IA_ID_PREFIX: ${{ vars.IA_ID_PREFIX }}
          PODCAST_MAX_RETRY_ATTEMPTS: ${{ vars.PODCAST_MAX_RETRY_ATTEMPTS }}
          BILLING_EXPORT_TABLE: ${{ vars.BILLING_EXPORT_TABLE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          set +e
          mkdir -p out/logs
          log_file="out/logs/geektime-he.log"
          python3 run_feed.py "geektime" 2>&1 | tee "$log_file"
          exit_code="${PIPESTATUS[0]}"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Pipeline failure"
            echo ""
            echo "- Pipeline: geektime-he"
            echo "- Exit code: ${{ steps.run_pipeline.outputs.exit_code || 'not started' }}"
            echo "- Log file: ${{ steps.run_pipeline.outputs.log_file }}"
            echo ""
            echo '```text'
            log_file="${{ steps.run_pipeline.outputs.log_file }}"
            if [[ -n "$log_file" && -f "$log_file" ]]; then
              tail -n 80 "$log_file"
            else
              echo "The pipeline did not start. See the failed setup step."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
