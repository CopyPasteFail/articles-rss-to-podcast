name: Temporary Ruff autofix
on:
  push:
    branches:
      - fix/ruff-repository-cleanup
permissions:
  contents: write
jobs:
  apply-safe-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply safe Ruff fixes
        run: |
          python -m pip install 'ruff==0.17.3'
          python -m ruff check --fix . || true
          python -m ruff format .
      - name: Commit safe fixes on cleanup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply safe Ruff lint fixes and formatting'
            git push
          fi
