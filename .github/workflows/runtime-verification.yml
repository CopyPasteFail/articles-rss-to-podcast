name: Verify published runtime

on:
  push:
    branches: [codex/podcast-runtime-optimization]
    paths: [.github/workflows/runtime-verification.yml]

permissions:
  contents: read
  packages: read

jobs:
  runtime-verification:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: 'ghcr.io/copypastefail/articles-rss-to-podcast-runtime@sha256:e41dc03c1ef1b591be8109a988d562edcd686e9f104c5ad829b411b204d58311'
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Check tools and audio from the read-only container
        run: python -m tools.smoke_runtime

      - name: Measure live source validation without TTS or state access
        run: |
          python - <<'PY'
          import time
          from dotenv import load_dotenv
          load_dotenv('configs/geektime.env', override=True)
          import pipeline
          started = time.monotonic()
          try:
              entries = pipeline.fetch_entries_from_rss()
              print(f'Source available: {len(entries)} entries')
          except SystemExit as exc:
              print(f'Source unavailable: {exc}')
          print(f'Source validation took {time.monotonic() - started:.2f} seconds')
          PY
